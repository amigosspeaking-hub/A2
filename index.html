<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aula Internacional Plus 2 — قارئ A2.1</title>
<style>
@font-face{font-family:Amiri;src:url(fonts/Amiri-Bold.woff2) format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:Tajawal;src:url(fonts/Tajawal-Regular.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Tajawal;src:url(fonts/Tajawal-Medium.woff2) format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:Tajawal;src:url(fonts/Tajawal-Bold.woff2) format('woff2');font-weight:700;font-display:swap}
:root{--bg:#FAF8F4;--ink:#232E29;--line:#E9E3D6;--soft:#F7F4ED;--gold:#A9700F;--gold2:#7A5209;
--navy:#14456E;--red:#CD1719;--card:#FFF;--muted:#6B736E}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Tajawal,'Segoe UI',Tahoma,sans-serif;font-size:15.5px;line-height:1.75}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
.top{position:sticky;top:0;z-index:40;background:rgba(250,248,244,.97);border-bottom:1px solid var(--line);backdrop-filter:blur(4px)}
.top1{display:flex;align-items:center;justify-content:center;gap:12px;padding:8px 16px 6px;max-width:1060px;margin:0 auto;flex-wrap:wrap}
.brand{font-weight:700;font-size:15px}
.brand i{font-style:normal;color:var(--gold)}
.brand small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 10px;max-width:1060px;margin:0 auto}
.tab{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 14px;font-size:13px;font-weight:700;color:#4A544E}
.tab .es{font-size:11.5px;color:var(--muted);font-weight:500;direction:ltr;unicode-bidi:isolate}
.tab.on{background:var(--navy);border-color:var(--navy);color:#fff}
.tab.on .es{color:#BCD3E6}
.oa,.od{direction:ltr;unicode-bidi:isolate}
.acard .ans{direction:ltr;unicode-bidi:isolate;text-align:left}
.minibar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 16px;max-width:1060px;margin:0 auto}
.mbbrand{font-size:13.5px;font-weight:700;color:var(--ink)}
.mbbrand i{color:var(--gold);font-style:normal;font-weight:800}
.mbinst{display:inline-block;margin-inline-start:10px;color:var(--gold);font-family:Amiri,'Times New Roman',serif;font-size:16px;font-weight:700;letter-spacing:.3px}
.mbinfo{flex:1;text-align:center;font-size:12.5px;color:var(--muted);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbinfo b{color:var(--ink);font-weight:700}
.mbinfo .esb{direction:ltr;unicode-bidi:isolate;text-align:left;display:inline-block;max-width:60%;vertical-align:bottom}
.mbinfo .pgno{color:var(--muted);font-weight:700}
.mbinfo .role{display:inline-block;padding:0 7px;border-radius:99px;font-size:11px;font-weight:700;vertical-align:1px}
.mbinfo .role.h{background:#E8EFF6;color:var(--navy)}
.mbinfo .role.b{background:#F8EED9;color:var(--gold2)}
.mbinfo .role.e{background:#E7F2E4;color:#2F6B33}
.mbinfo .more{color:var(--muted);font-weight:700}
.od.trb{font-size:10px;padding:0 5px}
.od.vid{background:#F8EED9;border-color:var(--gold);color:var(--gold2);font-size:10.5px}
body.chrome-off #chrome{display:none}
.pg{display:none}
.pg.on{display:block}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.tbtn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 11px;display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:700;color:#3C4641}
.tbtn.on{background:var(--gold);border-color:var(--gold);color:#fff}
.tbtn svg{width:17px;height:17px}
.tray{display:none;border-top:1px dashed var(--line);background:var(--soft);padding:9px 16px 11px}
.tray.open{display:block}
.trayin{max-width:1060px;margin:0 auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tray .lb{font-size:13px;font-weight:700;color:var(--gold2);margin-inline-end:4px}
.chip{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 12px;font-size:13.5px;font-weight:700;color:var(--navy);direction:ltr;unicode-bidi:isolate}
.chip.alt{color:var(--muted);border-style:dashed;font-weight:500;font-size:12.5px}
.chip.play{background:var(--navy);border-color:var(--navy);color:#fff}
.stage{max-width:1060px;margin:0 auto;padding:16px 14px 30px}
.pwrap{position:relative;background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 10px 30px rgba(35,46,41,.07);overflow:hidden}
.pwrap img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
/* أزرار الإجابة (صغيرة فوق النقطة) */
.oa{position:absolute;width:46px;max-width:46px;height:18px;padding:0 3px;border-radius:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;
background:rgba(255,255,255,.97);border:1.5px solid var(--red);color:var(--red);font-weight:700;font-size:11.5px;
box-shadow:0 2px 6px rgba(205,23,25,.25);display:flex;align-items:center;justify-content:center;z-index:5;
transform:translateY(-50%);line-height:1}
.oa.on{background:var(--red);color:#fff}
.oa:empty::before{content:"؟"}
.ow{background:rgba(20,69,110,.94);border-color:transparent;color:#fff;font-weight:700;font-size:10px;letter-spacing:.2px}
.ow:hover{background:#0C3455}
/* أزرار الصوت (فوق ملصق الأوديو) */
.od{position:absolute;height:19px;padding:0 6px;border-radius:5px;background:rgba(20,69,110,.94);
color:#fff;font-weight:700;font-size:11.5px;letter-spacing:.3px;display:flex;align-items:center;gap:4px;z-index:5;
box-shadow:0 2px 7px rgba(20,69,110,.35);direction:ltr;unicode-bidi:isolate;border:1px solid #0C3455}
.od::before{content:"";width:0;height:0;border-style:solid;border-width:4px 0 4px 6.5px;border-color:transparent transparent transparent #fff;opacity:.95}
.od:active{background:#0C3455}
.od.alt{background:rgba(255,255,255,.95);color:var(--navy);border:1.5px dashed var(--navy);font-weight:600}
.od.alt::before{display:none}
.acard{position:absolute;z-index:6;max-width:min(60%,470px);background:var(--card);border:1px solid #E4C9C9;border-top:3px solid var(--red);
border-radius:8px;box-shadow:0 14px 34px rgba(35,46,41,.2);padding:8px 12px 9px;display:none}
.acard.open{display:block}
.acard .ttl{font-size:11.5px;font-weight:700;color:var(--red);letter-spacing:.2px;margin-bottom:4px}
.acard .ans{direction:ltr;unicode-bidi:isolate;text-align:left;font-family:Georgia,'Times New Roman',serif;font-size:14.5px;line-height:1.55;color:#1C2430;white-space:pre-wrap;word-break:break-word}
.nav{display:flex;align-items:center;justify-content:center;gap:14px;padding:13px 4px 2px}
.nav .ico{width:40px;height:40px;border:1px solid var(--line);background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(35,46,41,.06)}
.nav .ico:disabled{opacity:.35;cursor:default}
.nav .ico svg{width:18px;height:18px}
.nav .pos{min-width:132px;text-align:center;font-weight:700;font-size:14.5px;color:#3C4641}
.nav .pos small{display:block;font-weight:500;font-size:11.5px;color:var(--muted)}
.pg{margin:0 0 30px;scroll-margin-top:150px;position:relative}
.pg .layer{display:contents}
.docnav{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:45;
background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:99px;padding:6px 12px;
gap:12px;box-shadow:0 12px 34px rgba(35,46,41,.2);backdrop-filter:blur(4px)}
.docnav .ico{width:36px;height:36px;border:1px solid var(--line);background:#fff;border-radius:50%;
display:flex;align-items:center;justify-content:center}
.docnav .ico:disabled{opacity:.35;cursor:default}
.docnav .ico svg{width:16px;height:16px}
.docnav .pos{min-width:118px;text-align:center;font-weight:700;font-size:13.5px;color:#3C4641}
.docnav .pos small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
@media (max-width:560px){ .docnav{bottom:8px;padding:5px 9px;gap:8px} .docnav .pos{min-width:96px;font-size:12.5px} }
.foot{max-width:1060px;margin:0 auto;padding:0 16px 26px;color:var(--muted);font-size:12.5px;text-align:center}
.aud{position:fixed;inset:auto 0 0 0;background:#fff;border-top:1px solid var(--line);padding:9px 16px;display:none;z-index:50;
box-shadow:0 -8px 24px rgba(35,46,41,.1)}
.aud.open{display:block}
.audin{max-width:1060px;margin:0 auto;display:flex;gap:10px;align-items:center}
.aud .now{font-weight:700;font-size:13.5px;color:var(--navy);direction:ltr;unicode-bidi:isolate;min-width:110px}
.aud input[type=range]{flex:1;accent-color:var(--gold)}
.aud .tm{font-size:12.5px;color:var(--muted);direction:ltr;unicode-bidi:isolate;min-width:74px;text-align:left}
/* إخفاء/إظهار أزرار الكتاب */
body.hideov .oa,body.hideov .od,body.hideov .acard{display:none!important}
/* وضع تعديل المواقع */
body.editmode .oa,body.editmode .od{outline:2px dashed var(--gold);outline-offset:1px;cursor:grab;touch-action:none}
body.editmode .oa:active,body.editmode .od:active{cursor:grabbing}
body.editmode .oa.on{outline-color:var(--red)}
body.editmode .od,body.editmode .oa{user-select:none;-webkit-user-select:none}
.od{transition:transform .14s ease,box-shadow .14s ease}
body.editmode .od.dragging{cursor:grabbing;transform:scale(1.07);z-index:9;box-shadow:0 8px 22px rgba(20,26,23,.35);transition:none}
.ehint{font-size:12.5px;color:var(--muted)}
.editbar .chip{cursor:pointer}
/* فهرس الوحدة */
.idxp{position:fixed;inset:0;background:rgba(35,46,41,.5);z-index:70;display:none;align-items:flex-start;justify-content:center;padding:5vh 14px;overscroll-behavior:contain}
.idxp.open{display:flex}
.idxin{background:var(--bg);border:1px solid var(--line);border-radius:16px;max-width:660px;width:100%;max-height:88vh;overflow:auto;overscroll-behavior:contain;box-shadow:0 30px 70px rgba(20,26,23,.35)}
.idxh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:16px 18px 8px;border-bottom:1px solid var(--line)}
.idxt{font-weight:700;font-size:16.5px;color:var(--ink)}
.idxt::after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gold);margin-inline-start:8px;vertical-align:2px}
.seg{margin-inline-start:auto;display:flex;border:1px solid var(--line);background:#fff;border-radius:99px;padding:3px;gap:3px}
.segb{border-radius:99px;padding:5px 13px;font-size:12.5px;font-weight:700;color:#5A635E;border:1px solid transparent}
.segb.on{background:var(--navy);border-color:var(--navy);color:#fff}
.idxx{width:34px;height:34px;border:1px solid var(--line);background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center}
.idxx svg{width:15px;height:15px}
.idxsub{padding:10px 18px 2px;font-size:13px;line-height:1.8;color:#5A635E}
.idxl{padding:8px 14px 18px}
.ixr{display:flex;width:100%;align-items:center;gap:11px;text-align:start;background:#fff;border:1px solid var(--line);border-radius:11px;padding:9px 12px;margin-top:8px}
.ixr:hover{border-color:#D8CDB4;background:#FFFDF8}
.ixr.on{background:#E8F0E4;border-color:#2F6B33}
.ixn{min-width:30px;height:30px;border-radius:8px;background:var(--soft);border:1px solid var(--line);color:var(--gold2);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex-direction:column;line-height:1.05}
.ixn small{font-size:7.5px;color:var(--muted);font-weight:700;letter-spacing:.3px}
.ixt{display:flex;justify-content:space-between;align-items:baseline;flex:1;min-width:0}
.ixt .es{display:block;direction:ltr;unicode-bidi:isolate;text-align:left;font-family:Inter,'Segoe UI',Tahoma,sans-serif;font-size:13.5px;font-weight:600;color:#2B352F;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ixt small{display:block;font-size:11.5px;color:var(--muted);font-weight:500;white-space:nowrap;flex-shrink:0}
.ixc{flex:0 0 auto;border-radius:99px;padding:3px 11px;font-size:11.5px;font-weight:700;border:1px solid}
.ixc.c-h{background:#EEF4FA;color:#14456E;border-color:#CBDBEA}
.ixc.c-b{background:#FBF3E2;color:#8A5A0B;border-color:#EBD9B4}
.ixc.c-e{background:var(--soft);color:#6B736E;border-color:var(--line)}
@media (max-width:560px){
 .tbtn span{display:none}
 .tbtn{padding:7px 9px}
 .idxp{padding:2vh 8px}
}
@media (max-width:700px){
 .brand{font-size:13.5px}
 .tab{padding:4px 11px;font-size:12.5px}
 .oa{height:16px;width:40px;max-width:40px;font-size:10px;padding:0 2px}
 .od{height:16.5px;font-size:10.5px;padding:0 4px}
 .acard{max-width:84%}
 .nav .ico{width:36px;height:36px}
}

/* ------- Mas gramatica popup ------- */
#mgPopup{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);}
#mgPopup.open{display:flex;}
#mgPopup .mgBox{background:#fff;border-radius:14px;width:min(92vw,520px);max-height:85vh;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.35);animation:mgPop .28s ease-out;position:relative;}
@keyframes mgPop{from{opacity:0;transform:scale(.92) translateY(14px)}to{opacity:1;transform:scale(1) translateY(0)}}
#mgPopup .mgClose{position:absolute;top:12px;right:14px;background:#eef2f7;border:none;border-radius:50%;width:34px;height:34px;font-size:20px;line-height:32px;cursor:pointer;color:#334155;font-weight:700;}
#mgPopup .mgClose:hover{background:#e2e8f0;}
#mgPopup .mgHead{padding:18px 20px 12px 20px;border-bottom:1px solid #e2e8f0;}
#mgPopup .mgTitle{font-size:17px;font-weight:700;color:#0f172a;margin:0 0 4px 0;}
#mgPopup .mgSub{font-size:12.5px;color:#64748b;margin:0;}
#mgPopup .mgBody{padding:18px 20px;}
#mgPopup .mgEs{font-size:15px;font-weight:700;color:#1e40af;margin:0 0 6px 0;}
#mgPopup .mgAr{font-size:14px;line-height:1.65;color:#334155;white-space:pre-wrap;font-family:Tahoma,"Segoe UI",Arial,sans-serif;}
#mgPopup .mgFoot{padding:12px 20px 18px 20px;border-top:1px solid #e2e8f0;text-align:center;}
#mgPopup .mgDone{background:#0f172a;color:#fff;border:none;border-radius:8px;padding:10px 24px;font-size:14px;cursor:pointer;}
#mgPopup .mgDone:hover{background:#1e293b;}



</style>
</head>
<body>
<div class="top">
  <div class="minibar">
    <div class="mbbrand"><i>A2.1</i><span class="mbinst">Instituto Amigos</span></div>
    <div class="mbinfo" id="mbInfo"></div>
    <button class="tbtn" id="chromeBtn" title="إظهار/إخفاء شريط الأدوات كامل"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/></svg><span id="chromeLbl">إخفاء الشريط</span></button>
  </div>
  <div id="chrome">
  <div class="top1">
    <div class="tools">
      <button class="tbtn" id="ansAll"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6z"/><circle cx="12" cy="12" r="2.6"/></svg><span>كل الإجابات</span></button>
      <button class="tbtn" id="audBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6.5 9H3v6h3.5L11 19z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 6a9 9 0 0 1 0 12"/></svg><span>الصوتيات</span></button>
      <button class="tbtn" id="idxBtn" title="فهرس أنشطة الوحدة بترتيب الكتاب"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3.5 6h.01"/><path d="M3.5 12h.01"/><path d="M3.5 18h.01"/></svg><span>فهرس الوحدة</span></button>
      <button class="tbtn" id="hideBtn" title="إخفاء أزرار الإجابات والصوت من صفحات الكتاب — واضغط تاني لتظهر عادي"><svg id="eyeIc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg><span id="hideLbl">إخفاء الأزرار</span></button>
      <button class="tbtn" id="editBtn" title="وضع تعديل مواقع الأزرار — اسحب كل زر لمكانه الصحيح"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l-3 3 3 3"/><path d="M9 5l3-3 3 3"/><path d="M15 19l-3 3-3-3"/><path d="M19 9l3 3-3 3"/><path d="M2 12h20"/><path d="M12 2v20"/></svg><span>تعديل المواقع</span></button>
    </div>
  </div>
  <div class="tabs" id="tabs"></div>
  </div>
  <div class="tray" id="tray"><div class="trayin" id="trayin"></div></div>
  <div class="tray" id="editTray"><div class="trayin">
    <span class="lb">وضع تعديل الأزرار:</span>
    <span class="ehint">اسحب = تحريك · دبل كليك = تعديل النص · كليك يمين = حذف · «+ إجابة» ثم دوس على الصفحة = إضافة.</span>
    <button class="chip" id="fixAdd" title="إضافة زر إجابة جديد في مكان تدوس عليه">+ إجابة</button>
    <button class="chip" id="fixExport">تنزيل ملف الإصلاحات</button>
    <button class="chip" id="fixImport">استيراد إصلاحات</button>
    <button class="chip alt" id="fixClear">مسح التعديلات</button>
    <input type="file" id="fixFile" accept=".json,application/json" hidden>
  </div></div>
</div>

<div class="stage" id="doc">
<section class="pg" id="p10" data-p="10"><div class="pwrap"><img loading="eager" alt="صفحة 10" src="pages/p010.jpg" width="1248" height="1531"><div class="layer" data-p="10"></div></div></section>
<section class="pg" id="p11" data-p="11"><div class="pwrap"><img loading="eager" alt="صفحة 11" src="pages/p011.jpg" width="1248" height="1531"><div class="layer" data-p="11"></div></div></section>
<section class="pg" id="p12" data-p="12"><div class="pwrap"><img loading="eager" alt="صفحة 12" src="pages/p012.jpg" width="1248" height="1531"><div class="layer" data-p="12"></div></div></section>
<section class="pg" id="p13" data-p="13"><div class="pwrap"><img loading="eager" alt="صفحة 13" src="pages/p013.jpg" width="1248" height="1531"><div class="layer" data-p="13"></div></div></section>
<section class="pg" id="p14" data-p="14"><div class="pwrap"><img loading="eager" alt="صفحة 14" src="pages/p014.jpg" width="1248" height="1531"><div class="layer" data-p="14"></div></div></section>
<section class="pg" id="p15" data-p="15"><div class="pwrap"><img loading="eager" alt="صفحة 15" src="pages/p015.jpg" width="1248" height="1531"><div class="layer" data-p="15"></div></div></section>
<section class="pg" id="p16" data-p="16"><div class="pwrap"><img loading="eager" alt="صفحة 16" src="pages/p016.jpg" width="1248" height="1531"><div class="layer" data-p="16"></div></div></section>

    // الأقسام المسموحة في النهاية (ME, TR, TR ME, GRAM)
    for (let i = u.me[0]; i <= u.me[1]; i++) push(i);
    (u.tr2 || []).forEach(push);
    if (u.met2 != null) push(u.met2);
    (u.mg || []).forEach(push);
    // حماية絶対ية: إذا out فاضي، أضف جميع صفحات الوحدة
    if (out.length === 0){
      for (let i = u.lo; i <= u.hi; i++) push(i);
      for (let i = u.me[0]; i <= u.me[1]; i++) push(i);
      (u.tr2 || []).forEach(push);
      if (u.met2 != null) push(u.met2);
      (u.mg || []).forEach(push);
      out.push(200); // جزء د
    }
    return out;
  }
  // مود العادي: الكتاب تصاعديًا ثم ME ثم التفريغات والقواعد
  for (let i = u.lo; i <= u.hi; i++) push(i);
  for (let i = u.me[0]; i <= u.me[1]; i++) push(i);
  (u.tr2 || []).forEach(push);
  if (u.met2 != null) push(u.met2);
  (u.mg || []).forEach(push);
  return out;
}
function viewOrder(){ const u = UNITS.find(x => x.k === CURV); return u ? unitOrder(u, idxMode) : []; }
function pageOrder(mode){ const out = []; UNITS.forEach(u => unitOrder(u, mode).forEach(p => { if (out.indexOf(p) < 0) out.push(p); })); return out; }
function showView(k, scrollTo){
  if (['u1','u2','u3','u4','mg'].indexOf(String(k)) < 0) k = 'u1';
  // إيقاف أي صوت يعمل قبل تغيير الوحدة لتجنب الجليتشات
  try{ if (!au.paused){ au.pause(); $('icPlay').style.display=''; $('icPause').style.display='none'; $('audBar').classList.remove('open'); queue=[]; qi=0; } }catch(e){}
  CURV = String(k);
  lastU = CURV;
  // إذا كان شريط الصوتيات مفتوحاً، أعد بناء قائمة الصوتيات للوحدة الجديدة
  try{ if ($('tray') && $('tray').classList.contains('open')) buildTray(); }catch(e){}
  // في تبويب الجرامر،_ORDER يُبنى من جميع صفحات القواعد عبر الوحدات الأربع
  if (k === 'mg'){
    ORDER = [];
    UNITS.forEach(u => { (u.mg || []).forEach(p => { if (PAGES.indexOf(p) >= 0 && ORDER.indexOf(p) < 0) ORDER.push(p); }); });
    ORDER.sort((a,b)=>a-b);
  } else {
    ORDER = viewOrder();
  }
  console.log('showView() k:', k, 'CURV:', CURV, 'ORDER length:', ORDER.length, 'ORDER:', ORDER);
  // حماية: إذا ORDER فارغة، استخدم جميع صفحات الوحدة الحالية من PAGES
  if (ORDER.length === 0){
    const u = UNITS.find(x => x.k === CURV) || UNITS[0];
    ORDER = [];
    for (let i = u.lo; i <= u.hi; i++) ORDER.push(i);
    for (let i = u.me[0]; i <= u.me[1]; i++) ORDER.push(i);
    (u.tr2 || []).forEach(p => ORDER.push(p));
    if (u.met2 != null) ORDER.push(u.met2);
    (u.mg || []).forEach(p => ORDER.push(p));
    ORDER.push(200);
    ORDER = ORDER.filter((v, i, a) => a.indexOf(v) === i);
    console.warn('showView: ORDER rebuilt for', CURV, ORDER.length, 'pages');
  }
  // ضمان وجود جميع أقسام صفحات ORDER في DOM
  ORDER.forEach(p => {
    if (!document.getElementById('p' + p)){
      const s = document.createElement('section');
      s.className = 'pg';
      s.setAttribute('data-p', p);
      s.innerHTML = '<div class="pwrap"><img loading="eager" alt="صفحة ' + p + '" src="pages/p' + String(p).padStart(3,'0') + '.jpg" width="1248" height="1531"><div class="layer" data-p="' + p + '"></div></div>';
      document.getElementById('doc').appendChild(s);
    }
  });
  // // إظهار صفحات الوحدة الحالية وإخفاء الباقي — شبكة أمان: إذا ORDER فاضي، أظهر كل صفحات الوحدة
  if (ORDER.length === 0){
    const u = UNITS.find(x => x.k === CURV) || UNITS[0];
    ORDER = [];
    for (let i = u.lo; i <= u.hi; i++) ORDER.push(i);
    ORDER.push(200);
  }
  document.querySelectorAll('section.pg').forEach(s => {
    const p = +s.dataset.p;
    const inUnit = ORDER.indexOf(p) >= 0;
    s.classList.toggle('on', inUnit);
    if (inUnit && s.querySelectorAll('img').length > 0){
      s.querySelectorAll('img').forEach(im => {
        if (!im.complete){ im.loading = 'eager'; const src = im.getAttribute('src'); im.removeAttribute('src'); im.setAttribute('src', src); }
      });
    }
  });
  syncTabs();
  try{ localStorage.setItem('lector_iview', CURV); }catch(e){}
  // حدد الصفحة الحالية
  if (scrollTo != null && ORDER.indexOf(scrollTo) >= 0){
    cur = scrollTo;
  } else {
    cur = ORDER.length > 0 ? ORDER[0] : PAGES[0];
  }
  syncPos();
  if (scrollTo != null && ORDER.indexOf(scrollTo) >= 0){
    pinTo(scrollTo, 3000);
    if (location.hash !== '#p' + scrollTo) history.replaceState(null, '', '#p' + scrollTo);
  } else {
    window.scrollTo(0, 0);
    if (location.hash !== '#p' + cur) history.replaceState(null, '', '#p' + cur);
  }
}

function buildTabs(){
  const t = $('tabs'); t.innerHTML='';
  TABS.forEach(tb=>{
    const b = document.createElement('button');
    b.className='tab'; b.dataset.k=tb.k;
    b.innerHTML = tb.ar + ' <span class="es">· ' + tb.es + '</span>';
    b.onclick = ()=>{
      if (tb.k === 'mg'){ showView('mg', null); return; }
      const uu = UNITS.find(x=>x.k===tb.k);
      const oo = unitOrder(uu, idxMode);
      if (oo.length) showView(tb.k, oo[0]); else go(uu.lo);
    };
    t.appendChild(b);
  });
}
function tabOf(p){
  // في تبويب الجرامر، كل صفحات القواعد归urr إلى الجرامر (ليست لوحدتها الأصلية)
  if (CURV === 'mg'){
    const allMg = [];
    UNITS.forEach(x => { (x.mg || []).forEach(p2 => allMg.push(p2)); });
    if (allMg.indexOf(p) >= 0) return 'mg';
  }
  const u = UNITS.find(u => (p >= u.lo && p <= u.hi) || (p >= u.me[0] && p <= u.me[1])
    || (u.mg || []).indexOf(p) >= 0 || (u.tr2 || []).indexOf(p) >= 0 || u.met2 === p);
  return u ? u.k : '';
}
function syncTabs(){
  const k = tabOf(cur);
  document.querySelectorAll('.tab').forEach(b=> b.classList.toggle('on', b.dataset.k===k));
}

  });

/* ------- التنقل ------- */
let ORDER = PAGES.slice();
let pinSeq = 0;
function pinTo(pid, dur){
  const sec = document.getElementById('p' + pid);
  if (!sec) return;
  const my = ++pinSeq;
  const until = Date.now() + (dur || 3000);
  const settle = ()=>{
    if (my !== pinSeq || Date.now() >= until) return;
    sec.scrollIntoView({block: 'start', behavior: 'smooth'});
    requestAnimationFrame(()=>{
      if (my !== pinSeq) return;
      const r = sec.getBoundingClientRect();
      if (r.top <= window.innerHeight * 0.55 && r.bottom >= window.innerHeight * 0.45){
        if (goLock) return;
        cur = pid; syncTabs(); syncPos();
        if (location.hash !== '#p' + pid) history.replaceState(null, '', '#p' + pid);
      } else setTimeout(settle, 200);
    });
  };
  settle();
  sec.querySelectorAll('img').forEach(im=>{ if (!im.complete) im.addEventListener('load', settle, {once: true}); });
  document.querySelectorAll('section.pg.on img').forEach(im=>{ if (!im.complete) im.addEventListener('load', settle, {once: true}); });
}
function go(p){
  if (goLock){ console.log('go() locked, ignoring call for page:', p); return; }
  goLock = true;
  console.log('go() called with page:', p, 'current CURV:', CURV);
  // أضف الصفحة تلقائياً إذا كانت موجودة في DOM ولكن غير مسجلة في PAGES
  if (PAGES.indexOf(p) < 0){
    const sec = document.getElementById('p' + p);
    if (sec){
      PAGES.push(p);
      PAGES.sort((x,y)=>x-y);
    } else {
      goLock = false;
      console.warn('go(): page', p, 'not found in PAGES or DOM');
      return;
    }
  }
  // تأكد من أن الصفحة موجودة في DOM (إنشاؤها تلقائياً إذا لزم الأمر)
  let sec = document.getElementById('p' + p);
  if (!sec && p === 200){
    sec = document.createElement('section');
    sec.className = 'pg';
    sec.setAttribute('data-p', '200');
    sec.innerHTML = '<div class="pwrap"><img loading="eager" alt="صفحة 200" src="pages/p200.jpg" width="1248" height="240"><div class="layer" data-p="200"></div></div>';
    document.getElementById('doc').appendChild(sec);
    console.log('go(): created p200 section in DOM');
  }
  if (!sec){
    const tab = tabOf(p);
    if (tab && tab !== CURV){
      goLock = false;
      showView(tab, p);
      return;
    }
    goLock = false;
    console.warn('go(): page', p, 'section not found in DOM');
    return;
  }
  const tab = tabOf(p);
  const targetTab = tab || CURV; // إذا لم نحدد الوحدة، استخدم الوحدة الحالية
  if (targetTab !== CURV){ showView(targetTab, p); return; }
  cur = p;
  closeCards();
  syncTabs(); syncPos();
  // ابقِ كل صفحات الوحدة ظاهرة (من showView) واسحب فقط للصفحة المختارة
  if ($('idxp') && $('idxp').classList.contains('open')) renderIdx();
  pinTo(p, 1600);
  if (location.hash !== '#p' + p) history.replaceState(null, '', '#p' + p);
  goLock = false;
}
/* drawing all pages of unit at once */
function syncPos(){
  const i = Math.max(0, ORDER.indexOf(cur));
  $('prevB').disabled = (i <= 0);
  $('nextB').disabled = (i >= ORDER.length - 1);
  let lbl = '—';
  const ub = UNITS.find(u => cur >= u.lo && cur <= u.hi);
  const um = UNITS.find(u => cur >= u.me[0] && cur <= u.me[1]);
  const utr = UNITS.find(u => (u.tr2 || []).indexOf(cur) >= 0);
  const umt = UNITS.find(u => u.met2 === cur);
  const ug = UNITS.find(u => (u.mg || []).indexOf(cur) >= 0);
  if (ub) lbl = ub.ar + ' · ' + ub.es;
  else if (um) lbl = um.ar + ' — تمارين إضافية';
  else if (utr) lbl = utr.ar + ' — تفريغ الكتاب';
  else if (umt) lbl = umt.ar + ' — تفريغ ME';
  else if (ug) lbl = ug.ar + ' — قواعد الوحدة';
  if (localStorage.getItem('lector_imode') === 't') lbl += ' · مود الكورس';
  $('posLbl').innerHTML = '<span dir="ltr" style="unicode-bidi:isolate">' + (i+1) + ' / ' + ORDER.length + '</span><small>' + lbl + '</small>';
  const rows = PINFO[String(cur)] || [];
  const _pt = ((PINFO[String(cur)] || [{}])[0].t || '');
  const pgLbl = cur >= 1000 ? (_pt.indexOf('gramática') >= 0 ? 'Más gramática — ص ' + cur : 'التفريغ — ص ' + cur) : ('ص ' + cur);
  let ih = '<span class="pgno">' + pgLbl + '</span>';
  if (rows.length){
    const r0 = rows[0];
    const rr = (r0.r || '');
    const rk = rr.indexOf('حصة') >= 0 ? 'h' : rr.indexOf('بيت') >= 0 ? 'b' : 'e';
    const rlbl = rr.indexOf('حصة') >= 0 ? 'حصة' : rr.indexOf('بيت') >= 0 ? 'بيت' : rr;
    let tt = (r0.t || '').replace(/\s+/g, ' ').trim();
    if (tt.length > 26) tt = tt.slice(0, 25) + '…';
    ih = (tt ? '<b class="esb" dir="ltr">' + tt + '</b> ' : '') + '<span class="pgno">' + pgLbl + '</span>'
   + (rlbl ? ' <span class="role ' + rk + '">' + rlbl + '</span>' : '');
       // تم إزالة "+1" حسب طلب المستخدم: لا نแสดง عدد الأنشطة الإضافية في نفس الصفحة لتجنب الإرباك
  }
  if ($('mbInfo')) $('mbInfo').innerHTML = ih;
}
$('nextB').onclick = ()=>{ const i=ORDER.indexOf(cur); if (i>=0 && i<ORDER.length-1) go(ORDER[i+1]); };
$('prevB').onclick = ()=>{ const i=ORDER.indexOf(cur); if (i>0) go(ORDER[i-1]); };
document.addEventListener('keydown', e=>{

// تحديث العنوان عند التمرير اليدوي بين الصفحات
let scrollTimer = null;
window.addEventListener('scroll', ()=>{
  if (scrollTimer) clearTimeout(scrollTimer);
  scrollTimer = setTimeout(()=>{
    const y = window.scrollY + window.innerHeight / 2;
    const secs = document.querySelectorAll('section.pg');
    let found = null;
    secs.forEach(sec=>{
      const r = sec.getBoundingClientRect();
      const pageTop = r.top + window.scrollY;
      const pageBottom = pageTop + r.height;
      if (y >= pageTop && y < pageBottom){
        found = parseInt(sec.getAttribute('data-p'));
      }
    });
    if (found && found !== cur && !goLock){
      cur = found;
      syncTabs();
      syncPos();
      if (location.hash !== '#p' + found) history.replaceState(null, '', '#p' + found);
    }
  }, 150);

function applyOrder(mode, silent){
  const doc = $('doc');
  // إعادة ترتيب الأقسام في DOM حسب وضعية الترتيب
  pageOrder(mode).forEach(p=>{ const s = document.getElementById('p' + p); if (s) doc.appendChild(s); });
  // تأكد من أن صفحة p200 (جزء د) موجودة في DOM
  if (!document.getElementById('p200') && document.querySelector('img[src*="p200.jpg"]')){
    const s200 = document.createElement('section');
    s200.className = 'pg';
    s200.setAttribute('data-p', '200');
    s200.innerHTML = '<div class="pwrap"><img loading="eager" alt="صفحة 200" src="pages/p200.jpg" width="1248" height="240"><div class="layer" data-p="200"></div></div>';
    doc.appendChild(s200);
  }
  ORDER = viewOrder();
  // حماية绝对ية: إذا ORDER فارغة لأي سبب، استخدم جميع صفحات الوحدة الحالية
  if (ORDER.length === 0){
    const u = UNITS.find(x => x.k === CURV) || UNITS[0];
    ORDER = [];
    for (let i = u.lo; i <= u.hi; i++) ORDER.push(i);
    for (let i = u.me[0]; i <= u.me[1]; i++) ORDER.push(i);
    (u.tr2 || []).forEach(p => ORDER.push(p));
    if (u.met2 != null) ORDER.push(u.met2);
    (u.mg || []).forEach(p => ORDER.push(p));
    ORDER.push(200); // جزء د
    ORDER = ORDER.filter((v, i, a) => a.indexOf(v) === i); // إزالة التكرار
    console.warn('applyOrder: ORDER was empty, rebuilt for', CURV, ORDER.length, 'pages');
  }
  if (!silent){
    cur = ORDER.length > 0 ? ORDER[0] : PAGES[0];
    showView(CURV, cur);
  }
}

/* ------- التنقل بين الصفحات: الترتيب داخل كل تبويب ثابت (كتاب ← ME ← تفريغ ← تفريغ ME ← قواعد) ------- */
/* مراقب: أي صفحة في منتصف الشاشة = الصفحة الحالية */
const secObs = new IntersectionObserver(es=>{
  es.forEach(e=>{
    if (e.isIntersecting){
      const p = parseInt(e.target.getAttribute('data-p'));
      if (p && p !== cur){
        cur = p; syncTabs(); syncPos();
        if (location.hash !== '#p' + p) history.replaceState(null, '', '#p' + p);
      }
    }
  });
}, {rootMargin: '-45% 0px -45% 0px', threshold: 0});

let editOn = false;

try { PST = JSON.parse(localStorage.getItem('lector_pills') || '{}') || {}; } catch(_){ PST = {}; }
function savePST(){ try { localStorage.setItem('lector_pills', JSON.stringify(PST)); } catch(_){} }
function pageList(p){ const k = String(p); if (!PST[k]) PST[k] = (OV[k] || []).map(o => Object.assign({}, o)); return PST[k]; }
let addArm = false;
function anchorCard(card, X, Y){
  if (X > 48){
    card.style.right = Math.max(1, 98 - X) + '%';
    card.style.left = 'auto';
  } else {
    card.style.left = X + '%';
    card.style.right = 'auto';
  }
  card.style.top = 'calc(' + Y + '% + 15px)';
}
function makeDrag(el, key, X0, Y0){
  el.addEventListener('pointerdown', e=>{
    if (!editOn) return;
    e.preventDefault(); e.stopPropagation();
    const wrap = el.closest('.pwrap').getBoundingClientRect();
    // القاعدة = الموقع الحالي الفعلي وقت الضغطة (مش موقع الإنشاء) — ده اللي كان بيسبب قفز المستطيل في السحب التاني
    const bx = parseFloat(el.style.left);
    const by = parseFloat(el.style.top);
    const X = isNaN(bx) ? X0 : bx;
    const Y = isNaN(by) ? Y0 : by;
    const sx = e.clientX, sy = e.clientY;
    const wPct = Math.max(2, 100 * el.getBoundingClientRect().width / wrap.width);
    const hPct = Math.max(2, 100 * el.getBoundingClientRect().height / wrap.height);
    const pid = e.pointerId;
    let moved = false, raf = 0, last = null;
    try { if (el.setPointerCapture) el.setPointerCapture(pid); } catch(_){}
    el.classList.add('dragging');
    const apply = ev=>{
      const dx = 100 * (ev.clientX - sx) / wrap.width;
      const dy = 100 * (ev.clientY - sy) / wrap.height;
      const nx = Math.min(100 - wPct - 0.3, Math.max(0.3, X + dx));
      const ny = Math.min(100 - hPct - 0.3, Math.max(0.3, Y + dy));
      const pp = parseInt(key), ii = parseInt(key.split('|')[1]);
      const it = pageList(pp)[ii];
      if (it){ it.x = Math.round(nx * 100) / 100; it.y = Math.round(ny * 100) / 100; }
      el.style.left = it ? it.x + '%' : nx + '%';
      el.style.top = it ? it.y + '%' : ny + '%';
      const card = el._card;
      if (card && card.classList.contains('open')) anchorCard(card, it ? it.x : nx, it ? it.y : ny);
    };
    const move = ev=>{
      if (ev.pointerId !== pid) return;
      if (ev.pointerType === 'mouse' && !ev.buttons){ end(); return; }
      if (!moved && Math.abs(ev.clientX - sx) + Math.abs(ev.clientY - sy) < 5) return;
      moved = true;
      last = ev;
      if (!raf) raf = requestAnimationFrame(()=>{ raf = 0; if (last) apply(last); });
    };
    const end = ()=>{
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', end);
      document.removeEventListener('pointercancel', end);
      window.removeEventListener('blur', end);
      if (raf){ cancelAnimationFrame(raf); raf = 0; if (last) apply(last); }
      el.classList.remove('dragging');
      if (moved){ savePST(); el._dragmoved = true; clearTimeout(el._ct); el._ct = setTimeout(()=>{ el._dragmoved = false; }, 150); }
    };
    document.addEventListener('pointermove', move, {passive: false});
    document.addEventListener('pointerup', end);
    document.addEventListener('pointercancel', end);
    window.addEventListener('blur', end);
  });
}

$('fixFile').onchange = (e)=>{
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try {
      const obj = JSON.parse(r.result);
      if (obj && obj.pages && typeof obj.pages === 'object'){ PST = obj.pages; }
      else if (obj && typeof obj === 'object'){
        for (const k in obj){
          const v = obj[k];
          if (typeof k === 'string' && k.indexOf('|') > 0 && v && typeof v === 'object'){
            const parts = k.split('|');
            const L = pageList(parseInt(parts[0]));
            const it = L[parseInt(parts[1])];
            if (it && 'x' in v){ it.x = v.x; it.y = v.y; }
          }
        }
      }
      savePST(); renderAll();
    } catch(_){}
  };
  r.readAsText(f);
  e.target.value = '';
};

  try{
    const startMode = localStorage.getItem('lector_imode') === 't' ? 't' : 'n';

    if (['u1','u2','u3','u4'].indexOf(String(v)) < 0) v = 'u1';
    showView(v, p >= 0 ? p : null);
    function warm(k){
      document.querySelectorAll('section.pg').forEach(sd=>{
        if (tabOf(+sd.dataset.p) !== k) return;
        sd.querySelectorAll('img[loading="lazy"]').forEach(im=>{
          im.loading = 'eager';
          if (im.decode) im.decode().catch(()=>{});
        });
      });
    }
    document.querySelectorAll('.tab').forEach(b=> b.addEventListener('pointerenter', ()=> warm(b.dataset.k)));
    let warmQ = PAGES.slice();
    const warmTick = ()=>{
      for (let n = 0; n < 3 && warmQ.length; n++){
        const sd = document.getElementById('p' + warmQ.shift());
        if (sd) sd.querySelectorAll('img').forEach(im=>{
          im.loading = 'eager';
          if (im.decode) im.decode().catch(()=>{});
        });
      }
      if (warmQ.length) setTimeout(warmTick, 70);
    };
    setTimeout(warmTick, 1200);
  }catch(e){
    console.error('Boot error:', e);
    document.body.innerHTML = '<div style="padding:50px;color:red;font-size:20px;text-align:center;">خطأ في تحميل الصفحة: ' + e.message + '<br><br>اضغط F5 لإعادة التحميل</div>';
  }
})();
